[package]
name = "rport-ui"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GUI manager for rport port forwarding"
license = "MIT"

[dependencies]
rport = { path = "../rport" }
eframe = "0.31"
egui = "0.31"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
home = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
