name: Release musl binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cc: musl-gcc
            linker: musl-gcc
            strip: strip
            cross_image: ""
          - target: aarch64-unknown-linux-musl
            cc: aarch64-unknown-linux-musl-gcc
            linker: aarch64-unknown-linux-musl-gcc
            strip: aarch64-unknown-linux-musl-strip
            cross_image: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target/${{ matrix.target }}
          key: musl-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      - name: Install musl cross toolchain
        run: |
          set -euxo pipefail
          if [ -z "${{ matrix.cross_image }}" ]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools
          else
            # cross-rs :main carries a crosstool-ng toolchain under
            # /x-tools/<triple>/bin (NOT /usr/local) and names binaries with
            # the full triple (aarch64-unknown-linux-musl-gcc). The image
            # makes them visible via ENV PATH, which `docker create`+`cp`
            # does not inherit — so stream the toolchain tree out (the tar
            # stream keeps root ownership, so `sudo` must untar it) and put
            # its bin on PATH for the following steps.
            docker pull "${{ matrix.cross_image }}"
            cid=$(docker create "${{ matrix.cross_image }}")
            sudo mkdir -p /opt/xtools-extract
            docker cp "$cid:/x-tools" - | sudo tar -C /opt/xtools-extract -xf -
            docker rm "$cid"
            sudo mkdir -p /x-tools
            # docker cp tar streams may nest the path basename; handle both.
            if [ -d /opt/xtools-extract/x-tools ]; then
              sudo cp -a /opt/xtools-extract/x-tools/. /x-tools/
            else
              sudo cp -a /opt/xtools-extract/. /x-tools/
            fi
            sudo rm -rf /opt/xtools-extract
            sudo chmod -R a+rX /x-tools
            echo "/x-tools/aarch64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
            # $GITHUB_PATH only takes effect for LATER steps — verify via
            # absolute path in this one.
            /x-tools/aarch64-unknown-linux-musl/bin/aarch64-unknown-linux-musl-gcc --version
          fi

      - name: Configure cargo linker
        run: |
          key="CARGO_TARGET_$(echo "${{ matrix.target }}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')_LINKER"
          echo "$key=${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p rport -p rport-server

      - name: Strip and verify fully static
        run: |
          for name in rport rport-server; do
            bin="target/${{ matrix.target }}/release/$name"
            ${{ matrix.strip }} "$bin"
            file "$bin"
            case "$(file "$bin")" in
              *"static-pie linked"*|*"statically linked"*) ;;
              *) echo "ERROR: $name is not fully static"; exit 1 ;;
            esac
          done

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          for name in rport rport-server; do
            cp "$name" "${name}-${{ matrix.target }}"
            sha256sum "${name}-${{ matrix.target }}" > "${name}-${{ matrix.target }}.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rport-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/rport-${{ matrix.target }}
            target/${{ matrix.target }}/release/rport-${{ matrix.target }}.sha256
            target/${{ matrix.target }}/release/rport-server-${{ matrix.target }}
            target/${{ matrix.target }}/release/rport-server-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
